name: Deploy explainer docs to GitHub Pages

# Publishes the self-contained verl × Ray explainer bundle in explainer_docs/
# to GitHub Pages. Deploys only that folder, so the site root is its index.html.

on:
  push:
    branches:
      - claude/verl-ray-rl-training-cao6Z
    paths:
      - "explainer_docs/**"
      - ".github/workflows/deploy-explainer-pages.yml"
  workflow_dispatch:

# Permissions needed to enable Pages and publish to it via the GITHUB_TOKEN.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload explainer_docs as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: explainer_docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
